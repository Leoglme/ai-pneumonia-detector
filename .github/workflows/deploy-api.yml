name: 🚀 Deploy FastAPI (api/) to VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'api/**'
  workflow_dispatch:

concurrency:
  group: fastapi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 🏗️ Deploy API
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout (sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            api
          sparse-checkout-cone: true
          lfs: false

      - name: 🧭 Debug workspace
        run: |
          pwd
          ls -la
          ls -la api || true
          cat .git/info/sparse-checkout || true
          find api -type f || true
          test -f api/requirements.txt && echo "api/requirements.txt exists" || echo "api/requirements.txt missing"

      - name: 🛠️ Create dummy file if api is empty
        run: |
          mkdir -p api
          touch api/.gitkeep

      - name: 🧱 Ensure target structure (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            TARGET_DIR="/var/www/api.ai-pneumonia-detector.dibodev.fr/html"
            sudo mkdir -p "$TARGET_DIR"
            sudo rm -rf "$TARGET_DIR/api"
            sudo mkdir -p "$TARGET_DIR/api"
            sudo mkdir -p "$TARGET_DIR/.venv"
            sudo chown -R $USER:$USER "$TARGET_DIR"

      - name: 📤 Upload API sources (SCP)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          strip_components: 0
          source: "api"
          target: /var/www/api.ai-pneumonia-detector.dibodev.fr/html

      - name: 🐍 Create/Update venv & install deps (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            TARGET_DIR="/var/www/api.ai-pneumonia-detector.dibodev.fr/html"
            cd "$TARGET_DIR"
            # Add MySQL GPG key
            sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys B7B3B788A8D3785C || true
            # Remove Docker repository
            if [ -f /etc/apt/sources.list.d/docker.list ]; then
              sudo rm -f /etc/apt/sources.list.d/docker.list
            fi
            # Update APT with error tolerance
            sudo apt-get update -y --allow-releaseinfo-change || true
            sudo apt-get install -y python3-venv
            # Debug requirements
            ls -la api/requirements.txt || echo "api/requirements.txt missing"
            # Rebuild the virtual environment only when the API dependency list changes, so no unused package stays behind
            REQUIREMENTS_HASH="$(sha256sum api/requirements.txt | cut -d ' ' -f 1)"
            if [ ! -x ".venv/bin/python" ] || [ "$(cat .venv/.requirements-hash 2>/dev/null)" != "$REQUIREMENTS_HASH" ]; then
              sudo rm -rf .venv
              python3 -m venv .venv
              . .venv/bin/activate
              python -m pip install --upgrade pip wheel
              pip install -r api/requirements.txt --no-cache-dir
              deactivate
              echo "$REQUIREMENTS_HASH" > .venv/.requirements-hash
            fi

      - name: ⚙️ Configure/restart systemd service (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            TARGET_DIR="/var/www/api.ai-pneumonia-detector.dibodev.fr/html"
            SERVICE_NAME="pneumo-api.service"
            DEPLOY_USER="${{ secrets.SSH_USERNAME }}"
            # One worker: each worker loads both models (about 1.7 GB at startup), two of them do not fit in the VPS memory
            # ExecStartPre: Keras extracts the weights into models/cnn/tmp* while loading and leaves the folder behind when the process is killed
            # RestartSec and OOMScoreAdjust: when memory runs out, this demo is stopped first and retried every 5 minutes instead of every 5 seconds
            sudo bash -c "cat > /etc/systemd/system/${SERVICE_NAME}" <<EOF
            [Unit]
            Description=Pneumonia FastAPI (Uvicorn)
            After=network.target
            [Service]
            User=${DEPLOY_USER}
            WorkingDirectory=${TARGET_DIR}
            Environment=PYTHONPATH=${TARGET_DIR}
            ExecStartPre=-+/usr/bin/find ${TARGET_DIR}/models/cnn -maxdepth 1 -type d -name 'tmp*' -exec rm -rf {} +
            ExecStart=${TARGET_DIR}/.venv/bin/uvicorn api.main:app --host 127.0.0.1 --port 8001 --workers 1 --proxy-headers
            Restart=always
            RestartSec=300
            OOMScoreAdjust=500
            KillSignal=SIGINT
            [Install]
            WantedBy=multi-user.target
            EOF
            sudo systemctl daemon-reload
            sudo systemctl enable ${SERVICE_NAME}
            sudo systemctl restart ${SERVICE_NAME}
            sudo systemctl --no-pager --full status ${SERVICE_NAME} || true

      - name: 🔄 Test & reload Nginx (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            sudo nginx -t
            sudo systemctl reload nginx